name: Publish Nexora Store and System Updates
on:
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: nexora-store-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the public Store catalog
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download official release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/nexora-assets"
          gh release download "$TAG" -D "$RUNNER_TEMP/nexora-assets"
      - name: Validate packages and publish version indexes
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 nexora-store/publish_release_assets.py "$RUNNER_TEMP/nexora-assets" "$TAG"
      - name: Commit updated public catalogs
        run: |
          git config user.name "Nexora Store Publisher"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nexora-store/catalog.json nexora-store/release-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "Store: release ${{ github.event.release.tag_name }}"
            git push origin HEAD:main
          fi
