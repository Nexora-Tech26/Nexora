name: Build Nexora public download

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-download:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download hosted parts
        run: |
          mkdir -p downloads tmp_parts
          for i in 0 1 2 3 4 5 6; do
            curl -fL --retry 4 "https://raw.githubusercontent.com/Nexora-Tech26/OmegaOS/nexora-hosting/downloads/nexora-beta1.part${i}.b64" -o "tmp_parts/part${i}.b64"
          done
      - name: Assemble ZIP
        run: |
          cat tmp_parts/part*.b64 | tr -d '\r\n' | base64 --decode > downloads/Nexora_26_Virel_Beta_1.zip
          test -s downloads/Nexora_26_Virel_Beta_1.zip
          file downloads/Nexora_26_Virel_Beta_1.zip
          unzip -t downloads/Nexora_26_Virel_Beta_1.zip
          sha256sum downloads/Nexora_26_Virel_Beta_1.zip
      - name: Commit public ZIP
        run: |
          git config user.name "Nexora Technologies"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/Nexora_26_Virel_Beta_1.zip
          git diff --cached --quiet && exit 0
          git commit -m "Add Nexora 26 Virel Beta 1 public ZIP"
          git push
